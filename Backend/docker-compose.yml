services:
  backend:
    build:
      context: .
    container_name: biblioteca_backend_api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:25433/biblioteca
      SPRING_DATASOURCE_USERNAME: biblioteca_user
      SPRING_DATASOURCE_PASSWORD: biblioteca_pass
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
